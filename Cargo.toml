[package]
name = "audio_engine"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Hi-Fi audio decode/resample engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
# `symphonia-bundle-opus = "0.5"` is not published on crates.io; Opus is
# handled by the FFmpeg fallback decoder instead.
# Use the FFmpeg-next major that matches the current system FFmpeg API. ffmpeg-next 8.1
# cannot bind against FFmpeg 9 (AVCodec layout and frame side data enums changed).
ffmpeg-next = { version = "9.0", optional = true }
anyhow = "1.0"
hound = "3.5"
flacenc = "0.4"
rand = "0.8"
libsamplerate-sys = "0.1"
libc = "0.2"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
