name: build-windows-release

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-ffmpeg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
            C:\Users\runneradmin\.m2\repository
          key: ${{ runner.os }}-cargo-maven-${{ hashFiles('**/Cargo.lock', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-maven-

      - name: Remove Linux-only Cargo environment
        run: rm -f .cargo/config.toml

      - name: Build Rust engine for Windows
        shell: msys2 {0}
        run: |
          export PATH="$HOME/.cargo/bin:/mingw64/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          export FFMPEG_DIR=/mingw64
          cargo build --release --no-default-features --target x86_64-pc-windows-gnu

      - name: Build Java GUI distribution
        run: |
          cd gui
          ./mvnw -q -DskipTests package \
            -Daudio.engine.native.dir="$PWD/../target/x86_64-pc-windows-gnu/release"

      - name: Build Windows installer
        run: |
          "$JAVA_HOME/bin/jpackage" \
            --type exe \
            --input gui/target/audio-engine-gui-1.1.0-dist \
            --dest dist \
            --name AudioEngine \
            --app-version 1.1.0 \
            --main-jar audio-engine-gui-1.1.0.jar \
            --main-class com.losshifi.audioengine.Main \
            --module-path gui/target/audio-engine-gui-1.1.0-dist \
            --add-modules javafx.controls,java.logging,java.naming \
            --win-menu \
            --win-shortcut

      - name: Upload Windows installer to v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist
          installer=$(find dist -maxdepth 1 -name '*.exe' -print -quit)
          test -n "$installer"
          gh release upload v1.1.0 "$installer" --repo DBC091126/audio_engine --clobber
          checksum="$installer.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$installer" > "$checksum"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$installer" > "$checksum"
          fi
          if [ -f "$checksum" ]; then
            gh release upload v1.1.0 "$checksum" --repo DBC091126/audio_engine --clobber
          fi
